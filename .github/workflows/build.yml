name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: unzip -q LocalChatAI.zip
      - name: Fix JVM target
        run: |
          cat >> LocalChatAI/app/build.gradle.kts <<'EOF'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF
      - run: gradle assembleDebug
        working-directory: LocalChatAI
      - uses: actions/upload-artifact@v4
        with:
          name: LocalChatAI-apk
          path: LocalChatAI/app/build/outputs/apk/debug/*.apk

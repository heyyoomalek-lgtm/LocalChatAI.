name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: unzip -q LocalChatAI.zip
      - name: Fix Kotlin code
        run: |
          F=LocalChatAI/app/src/main/java/com/malek/localchatai/MainActivity.kt
          sed -i 's/hintTextColor = getColor(R.color.muted);/setHintTextColor(getColor(R.color.muted));/' $F
          sed -i 's/padding = android.graphics.Rect(dp(14), dp(2), dp(8), dp(2))/setPadding(dp(14), dp(2), dp(8), dp(2))/' $F
      - name: Fix JVM target
        run: |
          cat >> LocalChatAI/app/build.gradle.kts <<'EOT'

          android {
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOT
      - run: gradle assembleDebug
        working-directory: LocalChatAI
      - uses: actions/upload-artifact@v4
        with:
          name: LocalChatAI-apk
          path: LocalChatAI/app/build/outputs/apk/debug/*.apk
